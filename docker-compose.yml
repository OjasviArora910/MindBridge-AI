# Local development stack: PostgreSQL + API + web UI.
#   cp .env.example .env   (optional; defaults work for a local demo with the mock LLM)
#   docker compose up --build
# Web UI: http://localhost:8080   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mindbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindbridge-local-only}
      POSTGRES_DB: mindbridge
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindbridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://mindbridge:${POSTGRES_PASSWORD:-mindbridge-local-only}@db:5432/mindbridge
      AUTO_CREATE_TABLES: "false"
      SECRET_KEY: ${SECRET_KEY:-local-dev-only-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  dbdata:
